name = "cms"
main = "src/index.js"
compatibility_date = "2025-02-01"

# ===== OBSERVABILITY  SETTINGS =====
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

# Environment variables
[vars]
ENVIRONMENT = "production"
SITE_NAME = "ZEDALBUMS.TOP"

[[r2_buckets]]
binding = "media"
bucket_name = "media"

[[d1_databases]]
binding = "DB"
database_name = "music-stats"
database_id = "c1f2a231-d2aa-474d-9181-210a9fb11e7e"

[[kv_namespaces]]
binding = "ADMIN_SESSIONS"
id = "c05b34847d3b4d2c8102e60740e0f6d3"

# ===== ADD THIS NEW KV NAMESPACE FOR ACTIVITY LOGS =====
[[kv_namespaces]]
binding = "ACTIVITY_LOGS"
id = "c05b34847d3b4d2c8102e60740e0f6d3"  # You can use the same ID or create a new one

# ===== CRON TRIGGERS =====
[triggers]
crons = ["0 0 * * *"]  # Runs at midnight every day